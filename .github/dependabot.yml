version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      react-coupled-major:
        patterns:
          - react
          - react-dom
        update-types:
          - major
      safe-dev-updates:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Keep the installed Firebase SDK 12 until the pinned rules-unit-testing
      # tooling supports Firebase 13. This does not change our cloud project.
      - dependency-name: firebase
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
