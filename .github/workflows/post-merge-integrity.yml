name: BCG.LK Post-Merge Integrity
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  checks: read
jobs:
  merge-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify latest main revision came from a reviewed, green PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { auditMergeProof } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/merge-integrity.mjs`);
            const {owner,repo} = context.repo;
            const targetSha = context.sha;
            const pullRequests = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {owner,repo,commit_sha:targetSha,per_page:100}
            );
            const matching = pullRequests.filter(pr => pr.merged_at &&
              pr.merge_commit_sha === targetSha && pr.base?.ref === 'main');
            const pr = matching.length === 1 ? matching[0] : null;
            const reviews = pr ? await github.paginate(github.rest.pulls.listReviews,
              {owner,repo,pull_number:pr.number,per_page:100}) : [];
            const checkRuns = pr ? await github.paginate(github.rest.checks.listForRef,
              {owner,repo,ref:pr.head.sha,per_page:100}) : [];
            const result = auditMergeProof({targetSha,pullRequests,reviews,checkRuns});
            core.info(`Reviewed merge provenance for ${targetSha}: ${result.pullRequest ?? 'no PR'}`);
            if (!result.ok) {
              for (const issue of result.failures) core.error(issue);
              core.setFailed('Unapproved main commit detected. Hold production and restore release controls.');
            }
