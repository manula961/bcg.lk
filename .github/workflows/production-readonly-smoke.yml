name: BCG.LK Production Read-Only Smoke
on:
  workflow_dispatch:
    inputs:
      public_origin:
        description: Public HTTPS domain approved for read-only checks
        required: true
        type: string
      expected_sha:
        description: Full 40-character Git commit SHA independently approved for production
        required: true
        type: string
permissions:
  contents: read
jobs:
  readonly-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Refuse unprotected or unreviewed GitHub production main
        run: node scripts/check-github-main-protection.mjs
        env:
          # Owner-created fine-grained token with Administration: read,
          # Pull requests: read and Checks: read. Never print or expose it.
          BCG_GITHUB_AUDIT_TOKEN: ${{ secrets.BCG_GITHUB_AUDIT_TOKEN }}
      - name: Safe GET-only production smoke checks
        run: node scripts/check-public-deployment.mjs
        env:
          BCG_PUBLIC_ORIGIN: ${{ inputs.public_origin }}
          BCG_APPROVED_PUBLIC_ORIGIN: ${{ vars.BCG_APPROVED_PUBLIC_ORIGIN }}
          BCG_REQUIRE_APPROVED_PUBLIC_ORIGIN: '1'
          BCG_EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_sha }}
