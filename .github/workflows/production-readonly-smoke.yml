name: BCG.LK Production Read-Only Smoke
on:
  workflow_dispatch:
    inputs:
      public_origin:
        description: Public HTTPS domain approved for read-only checks
        required: true
        type: string
permissions:
  contents: read
jobs:
  readonly-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Safe GET-only production smoke checks
        run: node scripts/check-public-deployment.mjs
        env:
          BCG_PUBLIC_ORIGIN: ${{ inputs.public_origin }}
