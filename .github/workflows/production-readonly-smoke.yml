name: BCG.LK Production Read-Only Smoke
on:
  workflow_dispatch:
    inputs:
      public_origin:
        description: Public HTTPS domain approved for read-only checks
        required: true
        type: string
permissions:
  contents: read
jobs:
  readonly-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Safe GET-only production smoke checks
        run: node scripts/check-public-deployment.mjs
        env:
          BCG_PUBLIC_ORIGIN: ${{ inputs.public_origin }}
