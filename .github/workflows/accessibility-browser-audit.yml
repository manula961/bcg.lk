name: BCG.LK Automated Accessibility Audit
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  accessibility-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build
      - name: Install pinned read-only browser accessibility tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Start isolated static app
        run: |
          (npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/bcg-accessibility.log 2>&1 &)
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bcg-accessibility.log
          exit 1
      - name: Check browser GTM under the exact Vercel CSP and WCAG accessibility
        shell: bash
        run: |
          set +e
          node tests/visual/analytics-csp-audit.mjs
          csp_status=$?
          node tests/visual/accessibility-audit.mjs
          accessibility_status=$?
          if [ "$csp_status" -ne 0 ] || [ "$accessibility_status" -ne 0 ]; then
            echo "CSP and/or accessibility acceptance remains open; inspect both logs."
            exit 1
          fi
      - name: Retain violations and review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bcg-accessibility-report
          path: artifacts/accessibility/
          if-no-files-found: warn
