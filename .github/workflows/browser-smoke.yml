name: BCG.LK Browser Smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      - name: Install pinned browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start preview server
        run: |
          (npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/bcg-preview.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bcg-preview.log
          exit 1
      - name: Check browser routes, mobile viewport and reduced motion
        run: node tests/visual/smoke.mjs
      - name: Exercise authenticated CMS against disposable Firebase emulators
        run: npx --yes firebase-tools@13.35.1 emulators:exec --only auth,firestore,storage --project demo-bcg-e2e "node tests/visual/admin-e2e.mjs"
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-browser-screenshots
          path: artifacts/browser/
          if-no-files-found: warn
