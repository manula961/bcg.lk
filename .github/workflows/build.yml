name: BCG.LK Build
on:
  push:
    branches: [main, feature/firebase]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Check non-JSX JavaScript syntax before installing dependencies
        run: node scripts/check-source-syntax.mjs
      - run: npm ci
      - name: Validate release configuration without secrets
        run: node scripts/check-release-config.mjs
      - run: npm run build
      - name: Check route entry size
        run: node scripts/check-bundle-budget.mjs
