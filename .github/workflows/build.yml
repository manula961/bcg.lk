name: BCG.LK Build
on:
  push:
    branches: [main, feature/firebase]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check route entry size
        run: node scripts/check-bundle-budget.mjs
