name: Backend checks
on:
  push:
    branches: [main, backend-updates]
  pull_request:
    branches: [main, backend-updates]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Check UI guard JavaScript syntax
        run: node --check scripts/verify-no-ui-changes.mjs
      - name: Parse repository JavaScript entrypoints
        shell: bash
        run: |
          set -euo pipefail
          # Without package.json type=module, node --check on .js can miss ESM
          # syntax errors; parse stdin explicitly as a module instead.
          node --check --input-type=module < middleware.js
          while IFS= read -r -d '' file; do
            case "$file" in
              *.mjs) node --check "$file" ;;
              *.js) node --check --input-type=module < "$file" ;;
            esac
          done < <(find api scripts src/lib -type f \\( -name '*.js' -o -name '*.mjs' \\) -print0)
      - name: Confirm no UI files changed
        if: github.event_name == 'pull_request'
        run: node scripts/verify-no-ui-changes.mjs
      - name: Confirm Jaliya-authored files are preserved
        if: github.event_name == 'pull_request'
        run: node scripts/verify-jaliya-preservation.mjs
      - run: npm ci
      - name: Validate nonsecret release configuration
        run: node scripts/check-release-config.mjs
      - run: npm run test
      - run: npm run build
      - name: Check route entry size
        run: node scripts/check-bundle-budget.mjs
  firebase-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Install emulator test tools (ephemeral, pinned)
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing@5.0.2
      - name: Run Firestore, Storage, and CMS integration tests
        run: npx --yes firebase-tools@13.35.1 emulators:exec --only firestore,storage --project demo-bcg-verification "node --test tests/integration/*.test.mjs"
