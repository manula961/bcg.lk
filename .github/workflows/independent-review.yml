name: Independent PR approval
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: read
jobs:
  independent-approval:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Require one independent fresh APPROVED review
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return core.setFailed('Pull request metadata unavailable');
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const latest = new Map();
            for (const review of reviews) {
              const login = review.user?.login;
              if (!login || login === pr.user.login || review.user?.type === 'Bot') continue;
              if (!['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)) continue;
              latest.set(login, review);
            }
            const approvals = [...latest.values()].filter(review =>
              review.state === 'APPROVED' && review.commit_id === pr.head.sha);
            if (!approvals.length) {
              core.setFailed('Review required: obtain one independent approval on the latest head commit before merging.');
            } else {
              core.info('Approved latest head by: ' + approvals.map(x => x.user.login).join(', '));
            }
